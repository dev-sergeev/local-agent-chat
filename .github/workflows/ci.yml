name: CI

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e '.[test]' build twine
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - run: python -m compileall -q local_agent_chat
      - run: bash -n scripts/run.sh
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Test the installed wheel outside the checkout
        run: python scripts/check_distribution.py dist/*.whl --work-dir "$RUNNER_TEMP/localchat-wheel"
      - name: Save distribution test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distribution-check-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/localchat-wheel/*.log
            ${{ runner.temp }}/localchat-wheel/result.json
      - name: Save release distributions
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: localchat-dist
          path: dist/*
          if-no-files-found: error
