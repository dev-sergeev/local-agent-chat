[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-chat"
version = "0.2.2"
description = "Local chat UI for OpenAI-compatible and GigaChat models with persistent history"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.14"
authors = [{name = "dev-sergeev"}]
keywords = ["chat", "llm", "chainlit", "react-agent", "localchat", "gigachat"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "chainlit>=2.11,<2.12",
  "langchain>=1.2,<2",
  "langchain-openai>=1.6,<2",
  "langchain-gigachat>=0.5.1,<0.6",
  "aiosqlite>=0.20,<1",
  "SQLAlchemy>=2.0,<3",
  "PyYAML>=6,<7",
  "python-dotenv>=1,<2",
]

[project.scripts]
localchat = "local_agent_chat.cli:main"

[project.urls]
Homepage = "https://github.com/dev-sergeev/local-agent-chat"
Documentation = "https://github.com/dev-sergeev/local-agent-chat#readme"
Issues = "https://github.com/dev-sergeev/local-agent-chat/issues"
Source = "https://github.com/dev-sergeev/local-agent-chat"

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "python-socketio[client]>=5.11,<6",
  "requests>=2,<3",
  "ruff>=0.13,<1",
]

[tool.setuptools.packages.find]
include = ["local_agent_chat*"]
namespaces = false

[tool.setuptools.package-data]
local_agent_chat = [
  "assets/*.md",
  "assets/chainlit/*.toml",
  "assets/chainlit/translations/*.json",
  "assets/public/*.css",
  "assets/public/*.js",
  "assets/public/*.png",
  "assets/public/avatars/*.png",
  "assets/examples/*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
